<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 72"><title>Black snake</title><style>.b{transform-box:fill-box;transform-origin:center;animation:s 1.8s ease-in-out infinite}.d1{animation-delay:-1.6s}.d2{animation-delay:-1.4s}.d3{animation-delay:-1.2s}.d4{animation-delay:-1s}.d5{animation-delay:-.8s}.d6{animation-delay:-.6s}.d7{animation-delay:-.4s}.d8{animation-delay:-.2s}.d9{animation-delay:0s}.r{fill:#c0262d}.k{fill:#0d0d0d}.g{fill:#fff;opacity:.28}@keyframes s{0%,100%{transform:translateY(-3px)}50%{transform:translateY(3px)}}@media (prefers-reduced-motion: reduce){.b{animation:none}}</style><g class="b d1"><ellipse class="r" cx="14" cy="38" rx="10" ry="3.5"/><ellipse class="k" cx="14" cy="37" rx="10" ry="3"/></g><g class="b d2"><ellipse class="r" cx="36" cy="37" rx="14" ry="5"/><ellipse class="k" cx="36" cy="36" rx="14" ry="4.5"/><ellipse class="g" cx="36" cy="33.5" rx="7" ry="1"/></g><g class="b d3"><ellipse class="r" cx="60" cy="37" rx="14" ry="6"/><ellipse class="k" cx="60" cy="36" rx="14" ry="5.5"/><ellipse class="g" cx="60" cy="32.5" rx="7" ry="1.2"/></g><g class="b d4"><ellipse class="r" cx="84" cy="37" rx="14" ry="7"/><ellipse class="k" cx="84" cy="36" rx="14" ry="6.5"/><ellipse class="g" cx="84" cy="31.5" rx="7" ry="1.3"/></g><g class="b d5"><ellipse class="r" cx="108" cy="37" rx="14" ry="7.5"/><ellipse class="k" cx="108" cy="36" rx="14" ry="7"/><ellipse class="g" cx="108" cy="31" rx="7" ry="1.4"/></g><g class="b d6"><ellipse class="r" cx="132" cy="37" rx="14" ry="7.5"/><ellipse class="k" cx="132" cy="36" rx="14" ry="7"/><ellipse class="g" cx="132" cy="31" rx="7" ry="1.4"/></g><g class="b d7"><ellipse class="r" cx="156" cy="37" rx="14" ry="7"/><ellipse class="k" cx="156" cy="36" rx="14" ry="6.5"/><ellipse class="g" cx="156" cy="31.5" rx="7" ry="1.3"/></g><g class="b d8"><ellipse class="r" cx="180" cy="37" rx="14" ry="6"/><ellipse class="k" cx="180" cy="36" rx="14" ry="5.5"/><ellipse class="g" cx="180" cy="32.5" rx="7" ry="1.2"/></g><g class="b d9